name: Pages

# 최신 GitHub Release 의 HTML 을 GitHub Pages 에 배포합니다.
# github-pages 환경은 기본 브랜치에서만 배포를 허용하므로, 태그가 아닌 main 기준으로 실행합니다.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download latest release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pages
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'novel-generator-v*.html' --dir dl
          cp dl/novel-generator-v*.html pages/index.html
          ls -la pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@v5
